name: Train Azure ML Model

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Login to Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 3 — Install Azure ML extension
      - name: Install Azure ML CLI extension
        run: az extension add -n ml -y

      # Step 4 — Submit Azure ML job
      - name: Submit Azure ML Training Job
        run: |
          az ml job create \
            --file train_job.yml \
            --workspace-name automl_exp \
            --resource-group automl_exp \
            --subscription e0da413c-131e-444d-a4f6-47b3875e9121
